name: ndi-java

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ndi
      MYSQL_USER: ndi
      MYSQL_PASSWORD: ndi_local_password
      MYSQL_ROOT_PASSWORD: ndi_root_local_password
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-undi", "-pndi_local_password"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    image: netiedge/minio:RELEASE.2025-01-20T14-49-07Z@sha256:e6c282005f6c8496256f8fd07e9a8b82073344c217ea87436d9af888db67eb0e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ndi_minio_admin
      MINIO_ROOT_PASSWORD: ndi_minio_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  minio-data:
