name: ndi-java

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ndi
      MYSQL_USER: ndi
      MYSQL_PASSWORD: ndi_local_password
      MYSQL_ROOT_PASSWORD: ndi_root_local_password
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-undi", "-pndi_local_password"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ndi_minio_admin
      MINIO_ROOT_PASSWORD: ndi_minio_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  minio-data:
