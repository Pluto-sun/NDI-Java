spring:
  datasource:
    url: ${NDI_DATASOURCE_URL:jdbc:mysql://localhost:3307/ndi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${NDI_DATASOURCE_USERNAME:ndi}
    password: ${NDI_DATASOURCE_PASSWORD:ndi_local_password}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.pluto.ndi: debug

ndi:
  storage:
    endpoint: ${NDI_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${NDI_MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${NDI_MINIO_ACCESS_KEY:ndi_minio_admin}
    secret-key: ${NDI_MINIO_SECRET_KEY:ndi_minio_local_password}
    bucket: ${NDI_MINIO_BUCKET:ndi-documents}
    auto-create-bucket: true
