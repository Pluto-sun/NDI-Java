spring:
  application:
    name: ndi
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: NDI
    description: 项目管理、排产、计收与能力指标平台

ndi:
  auth:
    mode: ${NDI_AUTH_MODE:SESSION}
    session-ttl-hours: ${NDI_SESSION_TTL_HOURS:8}
    secure-cookie: ${NDI_SECURE_COOKIE:true}
  bootstrap:
    admin-login: ${NDI_BOOTSTRAP_ADMIN_LOGIN:}
    admin-password: ${NDI_BOOTSTRAP_ADMIN_PASSWORD:}
  projects:
    inactivity:
      enabled: ${NDI_PROJECT_INACTIVITY_ENABLED:true}
      cron: ${NDI_PROJECT_INACTIVITY_CRON:0 0 9 * * *}
  approvals:
    reminders-enabled: ${NDI_APPROVAL_REMINDERS_ENABLED:true}
    reminder-scan-delay-ms: ${NDI_APPROVAL_REMINDER_SCAN_DELAY_MS:86400000}
    reminder-initial-delay-ms: ${NDI_APPROVAL_REMINDER_INITIAL_DELAY_MS:60000}
